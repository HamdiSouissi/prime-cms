name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: PHP ${{ matrix.php-version }} (Lint, PHPStan, Unit)
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, gd, exif, pdo_mysql, zip, fileinfo, openssl, intl
          coverage: none

      - name: Verify runtime without vendor/
        run: |
          php bin/prime list
          php bin/prime about
          php bin/prime routes

      - name: Verify compiled admin CSS is up to date
        run: |
          php bin/prime assets:build
          git diff --exit-code public/assets/admin/css/admin.css

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (PSR-12)
        run: |
          set -o pipefail
          if ! composer cs:check 2>&1 | tee /tmp/cs.log; then
            SUMMARY=$(tail -n 60 /tmp/cs.log | tr '\n' ' ' | cut -c1-1200)
            echo "::error title=PHP-CS-Fixer::$SUMMARY"
            exit 1
          fi

      - name: Run static analysis (PHPStan level 8)
        run: composer stan

      - name: Run unit and HTTP test suite (PHPUnit 11)
        run: vendor/bin/phpunit --exclude-group database

      - name: Check translation catalogues (no missing key, no hard-coded copy)
        run: |-
          set -o pipefail
          if ! php bin/prime lang:check --strict 2>&1 | tee /tmp/lang.log; then
            SUMMARY=$(tail -n 40 /tmp/lang.log | tr '\n' ' ' | cut -c1-1200)
            echo "::error title=lang:check::$SUMMARY"
            exit 1
          fi

  js-tests:
    name: JavaScript (Node 22 Syntax & Prime Editor Unit Tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check ES2022 syntax across all admin, theme, and plugin scripts
        run: |
          for f in public/assets/admin/js/*.js public/assets/admin/js/editor/*.js public/assets/admin/js/media/*.js content/themes/aurora/assets/js/*.js content/plugins/hello-prime/assets/js/*.js; do
            node --check "$f"
          done

      - name: Run zero-dependency Prime JS unit tests
        run: node tests/js/run.mjs

  database-tests:
    name: DB Tests (PHP ${{ matrix.php-version }} + ${{ matrix.db-label }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php-version: '8.2'
            db-label: MySQL 8.0
            db-image: mysql:8.0
            db-cmd: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          - php-version: '8.3'
            db-label: MySQL 8.0
            db-image: mysql:8.0
            db-cmd: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
          - php-version: '8.3'
            db-label: MariaDB 10.6
            db-image: mariadb:10.6
            db-cmd: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

    services:
      db:
        image: ${{ matrix.db-image }}
        env:
          MYSQL_ROOT_PASSWORD: prime_ci_secret_987
          MYSQL_DATABASE: prime_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pprime_ci_secret_987"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, gd, exif, pdo_mysql, zip, fileinfo, openssl, intl
          coverage: none

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run database integration test suite (fail on skipped)
        env:
          PRIME_TEST_DB_HOST: 127.0.0.1
          PRIME_TEST_DB_PORT: 3306
          PRIME_TEST_DB_DATABASE: prime_test
          PRIME_TEST_DB_USERNAME: root
          PRIME_TEST_DB_PASSWORD: prime_ci_secret_987
        run: vendor/bin/phpunit --group database --fail-on-skipped --testdox --log-junit /tmp/db-junit.xml

      - name: Report failed database tests as annotations
        if: failure()
        run: |
          php -r '
          if (!is_file("/tmp/db-junit.xml")) { echo "::error::No JUnit report produced\n"; exit(0); }
          $xml = simplexml_load_file("/tmp/db-junit.xml");
          foreach ($xml->xpath("//testcase[failure or error]") as $tc) {
              $msg = trim((string) ($tc->failure ?? $tc->error));
              $msg = str_replace(["\r", "\n"], ["", " | "], substr($msg, 0, 1200));
              echo "::error title=" . $tc["class"] . "::" . $tc["name"] . "::" . $msg . "\n";
          }
          '

  docker:
    name: Docker Compose install smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for database and application, test pre-install, install via CLI, and verify post-install
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://localhost:8080/health > /dev/null && \
               docker compose exec -T app php bin/prime db:check > /dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # Pre-install checks: /health = 200, / redirects to /install, /install = 200
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/)" = "302"
          curl -sI http://localhost:8080/ | grep -iq "^Location: /install"
          curl -sf http://localhost:8080/install | grep -q "Bienvenue dans Prime CMS"
          curl -sf http://localhost:8080/assets/admin/css/admin.css | grep -q -- "--brand-500"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/)" = "301"
          test "$(curl -s -X POST -o /dev/null -w '%{http_code}' http://localhost:8080/health)" = "405"
          curl -sI http://localhost:8080/install | grep -iq "X-Content-Type-Options: nosniff"

          # Execute full non-interactive CLI installation against real MySQL 8.0 container
          # (`--skip-env` preserves docker-compose environment injection and avoids root-owned `.env` on the runner host)
          docker compose exec -T app php bin/prime install \
            --db-host=db \
            --db-port=3306 \
            --db-name=prime_cms \
            --db-user=prime \
            --db-password=secret \
            --db-prefix=pc_ \
            --site-name="Prime Docker Smoke" \
            --site-url=http://localhost:8080 \
            --site-locale=fr \
            --timezone=Europe/Paris \
            --admin-name="Admin Docker" \
            --admin-email=admin@prime-docker.test \
            --admin-password="Ciel!Mandarine#8429" \
            --skip-env

          # Verify CLI tools against live DB
          docker compose exec -T app php bin/prime db:check | grep -q "Connexion à la base de données réussie"
          docker compose exec -T app php bin/prime migrate:status | grep -q "2026_11_15_000023_add_author_slug_and_bio_to_users_table"
          docker compose exec -T app php bin/prime media:link | grep -q "public/uploads"
          docker compose exec -T app php bin/prime themes:list | grep -q "aurora"
          docker compose exec -T app php bin/prime settings:get site_name | grep -q '"Prime Docker Smoke"'
          docker compose exec -T app php bin/prime role:list | grep -q "administrator"
          docker compose exec -T app php bin/prime user:list | grep -q "admin@prime-docker.test"
          docker compose exec -T app php bin/prime plugin:list | grep -q "hello-prime"
          docker compose exec -T app php bin/prime content:types | grep -q "Articles"
          docker compose exec -T app php bin/prime content:create --type=post --title="Bienvenue Docker" --status=published --body="Contenu créé par la smoke test." | grep -q "Bienvenue Docker"
          docker compose exec -T app php bin/prime content:list --type=post | grep -q "Bienvenue Docker"

          # Post-install checks: / renders active theme Aurora, /blog/{slug} = 200, /sitemap.xml + /robots.txt = 200, /install = 404, unauthenticated /admin -> 302 /admin/login
          curl -sf http://localhost:8080/ | grep -q "Prime Docker Smoke"
          curl -sf http://localhost:8080/ | grep -q "Bienvenue Docker"
          curl -sf http://localhost:8080/blog/bienvenue-docker | grep -q "Bienvenue Docker"
          curl -sf http://localhost:8080/sitemap.xml | grep -q "<sitemapindex"
          curl -sf http://localhost:8080/robots.txt | grep -q "Sitemap:"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/install)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/install/database)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/admin)" = "302"
          curl -sI http://localhost:8080/admin | grep -iq "^Location: /admin/login"
          curl -sI http://localhost:8080/admin/login | grep -iq "Cache-Control:.*no-store"

          # Authenticate via real POST /admin/login with CSRF token & session cookie jar
          COOKIE_JAR=$(mktemp)
          LOGIN_HTML=$(curl -sf -c "$COOKIE_JAR" http://localhost:8080/admin/login)
          CSRF_TOKEN=$(printf '%s' "$LOGIN_HTML" | sed -n 's/.*name="_csrf_token" value="\([^"]*\)".*/\1/p' | head -n 1)
          test -n "$CSRF_TOKEN"

          LOGIN_CODE=$(curl -s -b "$COOKIE_JAR" -c "$COOKIE_JAR" -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8080/admin/login \
            --data-urlencode "_csrf_token=$CSRF_TOKEN" \
            --data-urlencode "email=admin@prime-docker.test" \
            --data-urlencode "password=Ciel!Mandarine#8429")
          test "$LOGIN_CODE" = "302"

          # Authenticated admin checks: dashboard, media, content, taxonomies, appearance, settings, plugins, users, roles, profile, styleguide
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin | grep -q "Tableau de bord"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/media | grep -q "Médiathèque"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/content/page | grep -q "Pages"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/content/post | grep -q "Bienvenue Docker"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/taxonomies/category | grep -q "Non classé"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/appearance/themes | grep -q "Aurora"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/appearance/customizer | grep -q "Personnaliser"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/appearance/menus | grep -q "Menus de navigation"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/appearance/zones | grep -q "Zones de blocs"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/settings/reading | grep -q "Lecture"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/settings/permalinks | grep -q "Permaliens"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/settings/seo | grep -q "Référencement"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/plugins | grep -q "Hello Prime"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/users | grep -q "admin@prime-docker.test"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/roles | grep -q "Administrateur"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/profile | grep -q "Mon profil"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/styleguide | grep -q "Design System Prime CMS"

          # Phase 5 & 6 plugin smoke test: activate hello-prime via CLI, verify /admin dashboard, /hello-prime, /admin/hello-prime, testimonial CPT & taxonomy, then deactivate
          docker compose exec -T app php bin/prime plugin:activate hello-prime | grep -q "activé"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin | grep -q "Hello Prime"
          curl -sf http://localhost:8080/hello-prime | grep -q "Bonjour depuis Hello Prime"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/hello-prime | grep -q "Hello Prime"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/content/testimonial | grep -q "Témoignages"
          curl -sf -b "$COOKIE_JAR" http://localhost:8080/admin/taxonomies/testimonial_source | grep -q "Sources"
          docker compose exec -T app php bin/prime plugin:deactivate hello-prime | grep -q "désactivé"

          rm -f "$COOKIE_JAR"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/inconnu)" = "404"

          docker compose exec -T app php -m | grep -iq "mbstring"
          docker compose exec -T app php -m | grep -iq "pdo_mysql"
          docker compose exec -T app php -m | grep -iq "gd"
          docker compose exec -T app php -m | grep -iq "exif"

      - name: Tear down stack
        if: always()
        run: docker compose down -v
