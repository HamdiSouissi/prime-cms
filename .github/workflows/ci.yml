name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, gd, pdo_mysql, zip, fileinfo, openssl, intl
          coverage: none

      - name: Verify runtime without vendor/
        run: |
          php bin/prime list
          php bin/prime about
          php bin/prime routes

      - name: Install dev dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check code style (PSR-12)
        run: composer cs:check

      - name: Run static analysis (PHPStan level 6)
        run: composer stan

      - name: Run test suite (PHPUnit 11)
        run: composer test

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Start stack with Docker Compose
        run: docker compose up -d --build

      - name: Wait for application and verify HTTP endpoints
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              break
            fi
            sleep 1
          done

          curl -sf http://localhost:8080/ | grep -q "Le noyau est en place"
          curl -sf http://localhost:8080/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/inconnu)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health/)" = "301"
          test "$(curl -s -X POST -o /dev/null -w '%{http_code}' http://localhost:8080/health)" = "405"
          curl -sI http://localhost:8080/ | grep -iq "X-Content-Type-Options: nosniff"
          docker compose exec -T app php -m | grep -iq "mbstring"
          docker compose exec -T app php -m | grep -iq "pdo_mysql"
          docker compose exec -T app php -m | grep -iq "gd"

      - name: Tear down stack
        if: always()
        run: docker compose down -v
