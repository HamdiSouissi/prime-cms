services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    image: prime-cms:local
    container_name: prime-cms-app
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html
    environment: &php-env
      APP_NAME: "${APP_NAME:-Prime CMS}"
      APP_KEY: "${APP_KEY:-base64:cHJpbWUtY21zLWxvY2FsLWRldi1rZXktMzItYnl0ZXM=}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_TIMEZONE: "${APP_TIMEZONE:-UTC}"
      APP_LOCALE: "${APP_LOCALE:-fr}"
      LOG_LEVEL: "${LOG_LEVEL:-debug}"
      MAIL_DRIVER: "${MAIL_DRIVER:-log}"
      DB_HOST: "${DB_HOST:-db}"
      DB_PORT: "${DB_PORT:-3306}"
      DB_DATABASE: "${DB_DATABASE:-prime_cms}"
      DB_USERNAME: "${DB_USERNAME:-prime}"
      DB_PASSWORD: "${DB_PASSWORD:-secret}"
      DB_PREFIX: "${DB_PREFIX:-pc_}"
    depends_on:
      db:
        condition: service_started
    restart: unless-stopped

  # Neither `cron` nor a supervisor can be assumed inside a single PHP container, so the two
  # long-running loops the platform needs get their own service. They reuse the image `app` builds,
  # idle until the install lock appears (a fresh checkout must not spam failed tasks), and run as
  # `www-data` so every stamp they write stays writable by the web process.
  scheduler:
    image: prime-cms:local
    container_name: prime-cms-scheduler
    user: www-data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -f storage/installed.lock ]; do sleep 5; done
        while :; do php bin/prime schedule:run || true; sleep "$${SCHEDULER_INTERVAL:-60}"; done
    volumes:
      - .:/var/www/html
    environment:
      <<: *php-env
      SCHEDULER_INTERVAL: "${SCHEDULER_INTERVAL:-60}"
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped

  worker:
    image: prime-cms:local
    container_name: prime-cms-worker
    user: www-data
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while [ ! -f storage/installed.lock ]; do sleep 5; done
        while :; do php bin/prime queue:work --forever --sleep=2 || true; sleep 5; done
    volumes:
      - .:/var/www/html
    environment:
      <<: *php-env
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: prime-cms-db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-prime_cms}"
      MYSQL_USER: "${DB_USERNAME:-prime}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-secret}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
    volumes:
      - prime_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  prime_db_data:
